[project]
name = "online-cinema-fast-api"
version = "0.1.0"
description = "Online Cinema Fast API"
authors = [
    {name = "Sofia",email = "chizenko.sofia@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.16"
dependencies = [
    "pyjwt>=2.8.0",
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.2,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "stripe (>=16.0.0,<17.0.0)",
    "fastapi-mail (>=1.6.8,<2.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "greenlet (>=3.5.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
