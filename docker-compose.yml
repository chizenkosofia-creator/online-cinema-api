services:
  db:
    image: postgres:16
    container_name: postgres_cinema
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/
    networks:
      - theater_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema -h 127.0.0.1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: redis_cinema
    ports:
      - "6379:6379"
    networks:
      - theater_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: minio_cinema
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - theater_network

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog_cinema
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - theater_network

  api:
    build: .
    container_name: backend_cinema
    command: sh -c "alembic upgrade head && uvicorn src.main:src --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/src
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/src
    networks:
      - theater_network

  celery_worker:
    build: .
    container_name: celery_worker_cinema
    command: celery -A src.tasks.celery_app worker -l info
    env_file:
      - .env
    environment:
      - PYTHONPATH=/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/src
    networks:
      - theater_network

  celery_beat:
    build: .
    container_name: celery_beat_cinema
    command: celery -A src.tasks.celery_app beat -l info
    env_file:
      - .env
    environment:
      - PYTHONPATH=/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/src
    networks:
      - theater_network

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local

networks:
  theater_network:
    driver: bridge
